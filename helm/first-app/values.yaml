replicaCount: 1

image:
  repository: ghcr.io/thepja/first-app
  # Par défaut : appVersion du chart
  tag: ""
  pullPolicy: IfNotPresent

# Ex. : [{ name: ghcr-pull }] si l'image GHCR est privée
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: first-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

env: {}

nodeSelector: {}
tolerations: []
affinity: {}
