apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "first-app.fullname" . }}-test"
  labels:
    {{- include "first-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - test "$(curl -fs 'http://{{ include "first-app.fullname" . }}:{{ .Values.service.port }}/hello?name=Helm')" = "Hello, Helm!"
