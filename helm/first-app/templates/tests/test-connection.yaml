apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "first-app.fullname" . }}-test"
  labels:
    {{- include "first-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - test "$(curl -fsS 'http://{{ include "first-app.fullname" . }}:{{ .Values.service.port }}/hello?name=Helm')" = "Hello, Helm!"
