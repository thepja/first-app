{{- if .Values.testDatabase.enabled }}
{{- /*
  PostgreSQL JETABLE pour tester le chart (cluster kind en CI) : aucune persistance, mot de passe fixe.
  À ne jamais activer ailleurs : la vraie base est gérée hors du cluster (database.existingSecret).
  Les pods de la base portent leurs propres labels, pour ne pas être visés par la NetworkPolicy de l'application.
*/}}
{{- $name := printf "%s-test-db" (include "first-app.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
    {{- include "first-app.labels" . | nindent 4 }}
stringData:
  url: jdbc:postgresql://{{ $name }}:5432/postgres
  username: postgres
  password: test-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "first-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.testDatabase.image }}
          env:
            - name: POSTGRES_PASSWORD
              value: test-only
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "first-app.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
