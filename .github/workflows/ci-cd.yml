name: CI/CD

# Chaîne : build & tests (Java + Angular) -> image (construite une seule fois) -> scan + test Kubernetes
#          -> publication GHCR -> Render + staging (branche par défaut) / release + production (tags v*)
#
# Les étapes sont des workflows réutilisables du dépôt thepja/template-ci-cd, épinglés par SHA.

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # Formatage, compilation stricte, tests unitaires + intégration, couverture >= 80 %
    uses: thepja/template-ci-cd/.github/workflows/java-maven-ci.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      java-version: '21'
      artifact-path: target/first-app.jar
      artifact-name: first-app-jar

  frontend:
    name: Frontend (Angular)
    # Le build de production (budgets de taille compris) est refait dans l'image Docker ;
    # il est vérifié ici pour échouer tôt.
    uses: thepja/template-ci-cd/.github/workflows/node-ci.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      node-versions: '["24"]'
      working-directory: frontend
      test-command: npx ng test --watch=false
      build-command: npx ng build

  chart:
    name: Helm chart
    uses: thepja/template-ci-cd/.github/workflows/helm-lint.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      chart: helm/first-app
      values-files: values-staging.yaml values-production.yaml

  image:
    name: Docker image
    needs: [build, frontend]
    uses: thepja/template-ci-cd/.github/workflows/docker-build.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      build-args: REVISION=${{ needs.build.outputs.version }}
      local-tag: first-app:ci
      smoke-command: scripts/smoke-test.sh "$IMAGE"
      scanner: grype
      scan-severity: high

  k8s-test:
    name: Kubernetes (kind)
    needs: [image, chart]
    uses: thepja/template-ci-cd/.github/workflows/k8s-test.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      chart: helm/first-app
      release: first-app
      namespace: first-app-production
      values-files: values-production.yaml
      local-tag: first-app:ci
      rollout-test-args: --set-string podAnnotations.rollout=${{ github.run_id }}

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: [image, k8s-test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: thepja/template-ci-cd/.github/workflows/docker-publish.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      local-tag: first-app:ci

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: publish
    uses: thepja/template-ci-cd/.github/workflows/deploy-helm.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      chart: helm/first-app
      release: first-app
    secrets: inherit

  # Render construit l'image à partir du Dockerfile, au commit validé par la CI,
  # puis on attend que /version renvoie la version de ce commit.
  deploy-render:
    name: Deploy Render
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [build, publish]
    uses: thepja/template-ci-cd/.github/workflows/deploy-render.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      ref: ${{ github.sha }}
      expected-version: ${{ needs.build.outputs.version }}
      smoke-command: test "$(curl -fsS "${SERVICE_URL%/}/hello?name=Render")" = "Hello, Render!"
    secrets: inherit

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: write
    uses: thepja/template-ci-cd/.github/workflows/github-release.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      artifact-name: first-app-jar
      files: first-app.jar

  deploy-production:
    name: Deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, release]
    uses: thepja/template-ci-cd/.github/workflows/deploy-helm.yml@1b0e2768804a51aad1f486190f180cb8344669a7 # v1
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      chart: helm/first-app
      release: first-app
    secrets: inherit
