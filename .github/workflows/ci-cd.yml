name: CI/CD

# Chaîne : build & tests -> image (construite une seule fois) -> scan + test Kubernetes
#          -> publication GHCR -> staging (branche par défaut) / release + production (tags v*)

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LOCAL_IMAGE: first-app:ci
  HELM_VERSION: v3.18.4

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tag v1.2.3 -> 1.2.3 ; sinon 0.0.0-<sha court>
      - name: Calculer la version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Formatage, compilation stricte, tests unitaires + intégration, couverture >= 80 %
      - name: Build et tests
        run: ./mvnw -B verify -Drevision=${{ steps.version.outputs.version }}

      - name: Rapports de tests et couverture
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14

      - name: JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: first-app-jar
          path: target/first-app.jar
          retention-days: 14

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Installer kubeconform
        run: |
          curl -sSfLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform

      - name: Lint et validation des manifests
        run: |
          for env in staging production; do
            helm lint --strict helm/first-app -f helm/first-app/values-$env.yaml
            helm template first-app helm/first-app -f helm/first-app/values-$env.yaml \
              | ./kubeconform -strict -summary -
          done

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      # L'image est construite UNE fois ; ce même binaire est testé, scanné puis publié
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: REVISION=${{ needs.build.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Charger l'image
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Smoke test du conteneur (dont arrêt propre sur SIGTERM)
        run: |
          docker run -d -p 8080:8080 --read-only --tmpfs /tmp --name first-app "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
          test "$(curl -fs 'http://localhost:8080/hello?name=CI')" = "Hello, CI!"
          docker stop --time 10 first-app
          docker logs first-app

      - name: Scan de vulnérabilités (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Conserver l'image pour les jobs suivants
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  k8s-test:
    name: Kubernetes (kind)
    needs: [image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Créer le cluster kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: first-app

      - name: Déployer le chart (valeurs de production)
        run: |
          kind load image-archive "$RUNNER_TEMP/image.tar" --name first-app
          scripts/helm-deploy.sh production "$LOCAL_IMAGE"

      - name: Test de montée de version (rolling update)
        run: scripts/helm-deploy.sh production "$LOCAL_IMAGE" --set-string podAnnotations.rollout="$GITHUB_RUN_ID"

      - name: helm test
        run: helm test first-app -n first-app-production --logs

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl -n first-app-production get all,events
          kubectl -n first-app-production describe pods
          kubectl -n first-app-production logs -l app.kubernetes.io/name=first-app --tail=100

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: [build, image, k8s-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pousse exactement l'image testée (pas de reconstruction)
      - name: Pousser l'image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          for tag in $TAGS; do
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$LOCAL_IMAGE" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # Tag immuable utilisé pour les déploiements
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attestation de provenance (SLSA)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.tag }}
    secrets: inherit

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: first-app-jar

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: first-app.jar
          generate_release_notes: true

  deploy-production:
    name: Deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, release]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.tag }}
    secrets: inherit
