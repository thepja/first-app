name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # 1. Tests + packaging du JAR
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests et packaging
        run: ./mvnw -B verify

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: first-app-jar
          path: target/first-app.jar

  # 2. Image Docker : construite et testée à chaque fois, poussée sur GHCR hors PR
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: first-app:ci

      - name: Smoke test du conteneur
        run: |
          docker run -d --rm -p 8080:8080 --name first-app first-app:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/health && break
            sleep 1
          done
          test "$(curl -fs 'http://localhost:8080/hello?name=CI')" = "Hello, CI!"
          docker stop first-app

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. Déploiement : release GitHub (JAR) sur les tags v*
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: first-app-jar

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: first-app.jar
          generate_release_notes: true
