name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # 1. Tests + packaging du JAR
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests et packaging
        run: ./mvnw -B verify

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: first-app-jar
          path: target/first-app.jar

  # 2. Image Docker : construite et testée à chaque fois, poussée sur GHCR hors PR
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: first-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test du conteneur
        run: |
          docker run -d --rm -p 8080:8080 --name first-app first-app:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/health && break
            sleep 1
          done
          test "$(curl -fs 'http://localhost:8080/hello?name=CI')" = "Hello, CI!"
          docker stop first-app

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. Test des manifests Kubernetes sur un cluster éphémère (kind)
  k8s-test:
    name: Kubernetes (kind)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que les overlays se construisent
        run: |
          kubectl kustomize k8s/overlays/staging > /dev/null
          kubectl kustomize k8s/overlays/production > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: first-app:ci
          cache-from: type=gha

      - name: Créer le cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: first-app

      - name: Déployer sur kind
        run: |
          kind load docker-image first-app:ci --name first-app
          scripts/k8s-deploy.sh staging first-app:ci

      - name: Tester le service
        run: |
          kubectl -n first-app-staging port-forward svc/first-app 8080:80 &
          sleep 3
          test "$(curl -fs 'http://localhost:8080/hello?name=Kube')" = "Hello, Kube!"

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl -n first-app-staging get all
          kubectl -n first-app-staging describe pods
          kubectl -n first-app-staging logs -l app=first-app --tail=100

  # 4. Déploiement staging : chaque push sur main
  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main'
    needs: [docker, k8s-test]
    runs-on: ubuntu-latest
    environment: staging
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret KUBE_CONFIG absent
        if: env.KUBE_CONFIG == ''
        run: echo "::warning::Secret KUBE_CONFIG non défini pour l'environnement staging, déploiement ignoré."

      - name: Configurer kubectl
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Déployer
        if: env.KUBE_CONFIG != ''
        run: scripts/k8s-deploy.sh staging "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"

  # 5. Release + déploiement production : tags v*
  release:
    name: Release & deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, k8s-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: first-app-jar

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: first-app.jar
          generate_release_notes: true

      - name: Secret KUBE_CONFIG absent
        if: env.KUBE_CONFIG == ''
        run: echo "::warning::Secret KUBE_CONFIG non défini pour l'environnement production, déploiement ignoré."

      - name: Configurer kubectl
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Déployer
        if: env.KUBE_CONFIG != ''
        run: scripts/k8s-deploy.sh production "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
