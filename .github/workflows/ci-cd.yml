name: CI/CD

# Chaîne : build & tests (Java + Angular) + CodeQL -> image (construite une seule fois) -> smoke test, scan
#          et test Kubernetes -> publication GHCR -> Render + staging (branche par défaut)
#          / release + production (tags v*)
#
# Toute la logique CI/CD vient des workflows réutilisables de thepja/template-ci-cd (épinglés par SHA) ;
# ce fichier ne fait que les assembler avec les paramètres propres à first-app.

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # Formatage, compilation stricte, tests unitaires + intégration, couverture >= 80 %
    uses: thepja/template-ci-cd/.github/workflows/java-maven-ci.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      java-version: '21'
      artifact-path: target/first-app.jar
      artifact-name: first-app-jar

  frontend:
    name: Frontend (Angular)
    # Le build de production (budgets de taille compris) est refait dans l'image Docker ;
    # il est vérifié ici pour échouer tôt.
    uses: thepja/template-ci-cd/.github/workflows/node-ci.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      node-versions: '["24"]'
      working-directory: frontend
      test-command: npx ng test --watch=false
      build-command: npx ng build

  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: thepja/template-ci-cd/.github/workflows/codeql.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      languages: java-kotlin

  chart:
    name: Helm chart
    uses: thepja/template-ci-cd/.github/workflows/helm-lint.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      chart: helm/first-app
      values-files: values-staging.yaml values-production.yaml

  image:
    name: Docker image
    needs: [build, frontend]
    uses: thepja/template-ci-cd/.github/workflows/docker-build.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      build-args: REVISION=${{ needs.build.outputs.version }}
      local-tag: first-app:ci
      # L'application a besoin de PostgreSQL : smoke test personnalisé (base jetable + conteneur en
      # lecture seule), à la place du smoke test HTTP intégré qui démarre l'image seule
      smoke-checks: ''
      smoke-command: |
        docker network create smoke
        docker run -d --network smoke --name db -e POSTGRES_PASSWORD=smoke \
          postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        docker run -d --network smoke -p 8080:8080 --read-only --tmpfs /tmp --name app \
          -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres \
          -e SPRING_DATASOURCE_USERNAME=postgres -e SPRING_DATASOURCE_PASSWORD=smoke "$IMAGE"
        trap 'docker logs app; docker rm -f app db >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 90); do curl -fs -o /dev/null http://localhost:8080/health/readiness && break; sleep 1; done
        curl -fsS http://localhost:8080/health/readiness
        test "$(curl -fsS 'http://localhost:8080/hello?name=CI')" = "Hello, CI!"
        curl -fsS http://localhost:8080/ | grep -q '<app-root>'
        docker stop --time 10 app
        test "$(docker inspect -f '{{.State.ExitCode}}' app)" != 137 # arrêt propre sur SIGTERM
      scanner: grype
      scan-severity: high

  k8s-test:
    name: Kubernetes (kind)
    needs: [image, chart]
    uses: thepja/template-ci-cd/.github/workflows/k8s-test.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      chart: helm/first-app
      release: first-app
      namespace: first-app-production
      # values-ci.yaml ajoute un PostgreSQL jetable dans le namespace de test
      values-files: values-production.yaml values-ci.yaml
      local-tag: first-app:ci
      rollout-test-args: --set-string podAnnotations.rollout=${{ github.run_id }}

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: [image, k8s-test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: thepja/template-ci-cd/.github/workflows/docker-publish.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      local-tag: first-app:ci

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: publish
    uses: thepja/template-ci-cd/.github/workflows/deploy-helm.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      chart: helm/first-app
      release: first-app
    secrets: inherit

  # Render construit l'image à partir du Dockerfile, au commit validé par la CI,
  # puis on attend que /version renvoie la version de ce commit.
  deploy-render:
    name: Deploy Render
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [build, publish]
    uses: thepja/template-ci-cd/.github/workflows/deploy-render.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      ref: ${{ github.sha }}
      expected-version: ${{ needs.build.outputs.version }}
      smoke-checks: |
        /hello?name=Render Hello, Render!
    secrets: inherit

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: write
    uses: thepja/template-ci-cd/.github/workflows/github-release.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      artifact-name: first-app-jar
      files: first-app.jar

  deploy-production:
    name: Deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, release]
    uses: thepja/template-ci-cd/.github/workflows/deploy-helm.yml@245cea651d50d3ad502c10937ef81a642583b6b5 # v1.0.0
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      chart: helm/first-app
      release: first-app
    secrets: inherit
