name: Deploy

# Workflow réutilisable : déploie le chart Helm dans un environnement GitHub.
# Le secret KUBE_CONFIG (kubeconfig en base64) est lu dans l'environnement ciblé,
# ce qui permet d'y ajouter des règles de protection (validation manuelle, branches autorisées).

on:
  workflow_call:
    inputs:
      environment:
        description: staging ou production
        required: true
        type: string
      image:
        description: Image à déployer (dépôt:tag immuable)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    # Jamais deux déploiements simultanés sur le même environnement
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Secret KUBE_CONFIG absent
        if: env.KUBE_CONFIG == ''
        run: echo "::warning::Secret KUBE_CONFIG non défini pour l'environnement ${{ inputs.environment }}, déploiement ignoré."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.KUBE_CONFIG != ''

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: env.KUBE_CONFIG != ''
        with:
          version: v3.18.4

      - name: Configurer kubectl
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Déployer
        if: env.KUBE_CONFIG != ''
        run: scripts/helm-deploy.sh "${{ inputs.environment }}" "${{ inputs.image }}"

      - name: Vérification post-déploiement
        if: env.KUBE_CONFIG != ''
        run: helm test first-app -n "first-app-${{ inputs.environment }}" --logs

      - name: Résumé
        if: env.KUBE_CONFIG != ''
        run: |
          {
            echo "### Déployé sur \`${{ inputs.environment }}\`"
            echo "Image : \`${{ inputs.image }}\`"
            echo '```'
            helm history first-app -n "first-app-${{ inputs.environment }}" --max 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
