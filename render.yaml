# Blueprint Render : https://render.com/docs/blueprint-spec
# Render construit l'image à partir du Dockerfile de ce dépôt.
# Pas de déploiement automatique sur push : la CI déclenche le déploiement (deploy hook)
# une fois les tests passés, en désignant le commit exact qui a été validé.
services:
  - type: web
    name: first-app
    runtime: docker
    repo: https://github.com/thepja/first-app
    branch: feat/1.0
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/readiness
    autoDeployTrigger: "off"
    # Render fournit la variable PORT, lue par l'application
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: first-app-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: first-app-db
          property: password

databases:
  - name: first-app-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
