# Blueprint Render : https://render.com/docs/blueprint-spec
# Render construit l'image à partir du Dockerfile de ce dépôt.
# Pas de déploiement automatique sur push : la CI déclenche le déploiement (deploy hook)
# une fois les tests passés, en désignant le commit exact qui a été validé.
services:
  - type: web
    name: first-app
    runtime: docker
    repo: https://github.com/thepja/first-app
    branch: feat/1.0
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: "off"
    # Render fournit la variable PORT, lue par l'application
